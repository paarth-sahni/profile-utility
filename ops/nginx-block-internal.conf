# Purpose: keeps the scheduler's endpoint off the public internet. The timer on the server calls the app directly on
# 127.0.0.1 and never passes through nginx, so nginx can refuse this path completely. (The route also refuses any request that
# carries forwarding headers and any request without the shared secret: three separate locks.)
# Add inside the `server { ... }` block of the site, next to the other `location` blocks, then `nginx -t && systemctl reload nginx`.
# If the site is served under a sub-path, put that prefix in front, e.g. /profile/api/internal/.
location /api/internal/ {
    return 404;
}
